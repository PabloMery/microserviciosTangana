spring.application.name=microserviciosTangana

# --- Configuración de Base de Datos MySQL ---
# Asegúrate de que el puerto 3306 es correcto para tu instalación
spring.datasource.url=jdbc:mysql://localhost:3306/tangana_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=root
# ¡IMPORTANTE! Cambia 'tu_password' por tu contraseña real de MySQL. Si no tienes, déjalo vacío.
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuración de JPA (Hibernate) ---
# Esto creará las tablas automáticamente basándose en tus clases Java (Entidades)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect